name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: vsm-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --release --workspace
      - name: Check third-party notices are current
        run: |
          python tools/rust_notices.py docs/third-party
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- docs/third-party
      - run: pwsh tools/build-product.ps1 -OutputDirectory out/product
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-spatial-mic-windows-development
          path: out/product
          if-no-files-found: error
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --locked --release -p vsm-core -p vsm-live
