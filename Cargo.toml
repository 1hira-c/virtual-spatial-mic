[workspace]
resolver = "2"
members = ["crates/vsm-core", "crates/vsm-live", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"

# Keep HRTF parsing and convolution usable in debug builds and tests.
[profile.dev.package.sofar]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
