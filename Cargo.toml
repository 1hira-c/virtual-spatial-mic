[workspace]
resolver = "2"
members = ["crates/vsm-core", "crates/vsm-live", "crates/vsm-obs", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
libloading = "0.8"

[profile.release]
lto = "thin"
